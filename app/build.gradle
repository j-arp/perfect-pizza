plugins {
    id 'com.android.application'
}

android {
    namespace = 'net.arpcentral.pizzadoh'
    compileSdk = 37

    defaultConfig {
        applicationId = "net.arpcentral.pizzadoh"
        minSdk = 21
        targetSdk = 37
        versionCode = 9
        versionName = "1.3.0"
    }

    // Release/upload signing. Credentials live in local.properties (gitignored):
    //   RELEASE_STORE_FILE=/absolute/path/to/upload.jks
    //   RELEASE_STORE_PASSWORD=...
    //   RELEASE_KEY_ALIAS=upload
    //   RELEASE_KEY_PASSWORD=...
    def signingProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) localPropsFile.withInputStream { signingProps.load(it) }
    def releaseStoreFile = signingProps.getProperty('RELEASE_STORE_FILE')
    def hasReleaseSigning = releaseStoreFile != null && rootProject.file(releaseStoreFile).exists()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = signingProps.getProperty('RELEASE_STORE_PASSWORD', '')
                keyAlias = signingProps.getProperty('RELEASE_KEY_ALIAS', 'upload')
                keyPassword = signingProps.getProperty('RELEASE_KEY_PASSWORD', '')
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'com.google.android.material:material:1.13.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}
